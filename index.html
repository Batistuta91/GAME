<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>המשחק של התינוקת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@400..700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .screen {
    position: fixed;
    inset: 0;
    display: none;
    background-size: 400% 400%;
    animation: bgShift 14s ease infinite;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .screen.active { display: block; }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ---------- MENU ---------- */
  #menu {
    background: linear-gradient(135deg, #A0E7E5, #B4F8C8, #FBE7C6);
  }
  #menuGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: minmax(110px, 1fr);
    gap: 14px;
    width: 100%;
    min-height: 100%;
    padding: 16px;
  }
  .menu-btn {
    border: none;
    border-radius: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 60px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    transition: transform 0.08s ease;
    min-height: 110px;
  }
  .menu-btn.wide { grid-column: span 2; }
  .menu-btn:active { transform: scale(0.94); }
  .menu-btn span.label {
    font-size: 22px;
    font-weight: bold;
    color: rgba(0,0,0,0.6);
  }
  #menuAnimals { background: #FFD93D; }
  #menuTools { background: #6BCB77; }
  #menuNotes { background: #FF9DE3; }
  #menuColors { background: #FF9F80; }
  #menuNumbers { background: #8ECAE6; }
  #menuFarts { background: #C7F0BD; }
  #menuBubbles { background: #B8E8FC; }
  #menuShapes { background: #FFE29A; }
  #menuBalloons { background: #FFC2E2; }
  #menuBells { background: #FFD97D; }
  #menuLetters { background: #B5EAD7; }
  #menuLettersEn { background: #C8E7FF; }
  #menuLettersAr { background: #FFE0B5; }

  /* ---------- STAGE BACK BUTTON ---------- */
  .back-btn {
    position: fixed;
    top: 14px;
    left: 14px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    border: none;
    font-size: 22px;
    z-index: 30;
  }

  /* ---------- GRIDS (shared) ---------- */
  .item-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: minmax(110px, 1fr);
    gap: 10px;
    width: 100%;
    min-height: 100%;
    padding: 10px;
  }
  .item-btn {
    border: none;
    border-radius: 28px;
    font-size: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    transition: transform 0.08s ease;
    min-height: 110px;
  }
  .item-btn:active { transform: scale(0.9); }
  .item-btn.playing { animation: wiggle 0.5s ease; }
  .item-btn.wide { grid-column: span 2; }
  @keyframes wiggle {
    0% { transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.25) rotate(-10deg); }
    50% { transform: scale(1.15) rotate(8deg); }
    75% { transform: scale(1.2) rotate(-6deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  /* Animals screen colors */
  #animalsScreen { background: linear-gradient(135deg, #FFE29F, #FFA99F, #FF719A); }
  #dog { background: #FFD93D; }
  #cat { background: #6BCB77; }
  #cow { background: #FFB6C1; }
  #sheep { background: #A8D8FF; }
  #duck { background: #B4F0C7; }
  #pig { background: #FFC9E3; }
  #rooster { background: #FFA5D2; }

  /* Tools screen colors */
  #toolsScreen { background: linear-gradient(135deg, #D0F4DE, #A9DEF9, #FCF6BD); }
  #hammer { background: #FFB4A2; }
  #wrench { background: #A9DEF9; }
  #screwdriver { background: #FCF6BD; }
  #saw { background: #E4C1F9; }
  #paintbrush { background: #B9FBC0; }
  #scissors { background: #F1C0E8; }

  /* Notes screen colors */
  #notesScreen { background: linear-gradient(135deg, #FBC4AB, #F8AD9D, #FFD6A5); }
  #note1 { background: #FFADAD; }
  #note2 { background: #FFD6A5; }
  #note3 { background: #FDFFB6; }
  #note4 { background: #CAFFBF; }
  #note5 { background: #9BF6FF; }
  #note6 { background: #BDB2FF; }

  /* Colors screen */
  #colorsScreen { background: linear-gradient(135deg, #E0F7FA, #FFF9C4, #FFE0F0); }
  .item-btn.plain { font-size: 0; }
  #col1 { background: #FF6B6B; }
  #col2 { background: #4D96FF; }
  #col3 { background: #FFD93D; }
  #col4 { background: #6BCB77; }
  #col5 { background: #A66DD4; }
  #col6 { background: #FF9DE3; }

  /* Numbers screen */
  #numbersScreen { background: linear-gradient(135deg, #C1FBA4, #A8DADC, #FFE8A3); }
  #num1 { background: #FFADAD; }
  #num2 { background: #FFD6A5; }
  #num3 { background: #FDFFB6; }
  #num4 { background: #CAFFBF; }
  #num5 { background: #9BF6FF; }
  #num6 { background: #BDB2FF; }
  .item-btn.number-btn {
    font-size: 56px;
    font-weight: bold;
    color: rgba(0,0,0,0.55);
    flex-direction: column;
  }
  .item-btn.number-btn .num-emoji { font-size: 60px; }

  /* Farts screen */
  #fartsScreen { background: linear-gradient(135deg, #D4F1BE, #FFF3B0, #FFD6BA); }
  #fart1 { background: #FFCAD4; }
  #fart2 { background: #C9F2C7; }
  #fart3 { background: #FFE5A0; }
  #fart4 { background: #BDE0FE; }
  #fart5 { background: #E4C1F9; }
  #fart6 { background: #FFB4A2; }

  /* Bubbles screen */
  #bubblesScreen { background: linear-gradient(135deg, #CDEFFF, #E0F7FA, #F0FFFA); }
  .item-btn.plain.bubble { font-size: 0; border-radius: 50%; }
  #bub1 { background: radial-gradient(circle at 35% 30%, #ffffff, #A0D8F1 70%); }
  #bub2 { background: radial-gradient(circle at 35% 30%, #ffffff, #B9F3D6 70%); }
  #bub3 { background: radial-gradient(circle at 35% 30%, #ffffff, #FBE3A0 70%); }
  #bub4 { background: radial-gradient(circle at 35% 30%, #ffffff, #F6B8D8 70%); }
  #bub5 { background: radial-gradient(circle at 35% 30%, #ffffff, #CBB9F6 70%); }
  #bub6 { background: radial-gradient(circle at 35% 30%, #ffffff, #A9E5C9 70%); }

  /* Shapes screen */
  #shapesScreen { background: linear-gradient(135deg, #FFF3D6, #FFE0EC, #E0F0FF); }
  #shp1 { background: #FF6B6B; }
  #shp2 { background: #4D96FF; }
  #shp3 { background: #FFD93D; }
  #shp4 { background: #6BCB77; }
  #shp5 { background: #A66DD4; }
  #shp6 { background: #FF9DE3; }

  /* Balloons screen */
  #balloonsScreen { background: linear-gradient(135deg, #FFF0F5, #E0F7FF, #FFF9E0); }
  #bal1 { background: #FF6B6B; }
  #bal2 { background: #4D96FF; }
  #bal3 { background: #FFD93D; }
  #bal4 { background: #6BCB77; }
  #bal5 { background: #A66DD4; }
  #bal6 { background: #FF9DE3; }

  /* Bells screen */
  #bellsScreen { background: linear-gradient(135deg, #FFF6E0, #FFE8CC, #FFD9B3); }
  #bell1 { background: #FFB347; }
  #bell2 { background: #FFCC70; }
  #bell3 { background: #FFE08A; }
  #bell4 { background: #F4A261; }
  #bell5 { background: #E9C46A; }
  #bell6 { background: #F0C987; }

  /* Letters screen */
  #lettersScreen { background: linear-gradient(135deg, #E8F9F0, #FFF6E5, #EAF4FF); overflow-y: auto; }
  #lettersEnScreen { background: linear-gradient(135deg, #E5F3FF, #FFF9E5, #F0E5FF); overflow-y: auto; }
  #lettersArScreen { background: linear-gradient(135deg, #FFF3E0, #E0FFF3, #F3E0FF); overflow-y: auto; }
  .letters-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    width: 100%;
    padding: 70px 8px 20px 8px;
  }
  .letter-card {
    border: none;
    border-radius: 20px;
    background: #FFFFFF;
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 4px;
    transition: transform 0.08s ease;
  }
  .letter-card:active { transform: scale(0.92); }
  .letter-card.playing { animation: wiggle 0.5s ease; }
  .letter-print {
    font-size: 34px;
    font-weight: bold;
    color: #333;
  }
  .letter-cursive {
    font-family: 'Playpen Sans Hebrew', 'Noto Sans Hebrew', Arial, sans-serif;
    font-style: italic;
    font-size: 26px;
    color: #6B4FA0;
    margin-top: 2px;
  }
  .letter-sub {
    font-size: 24px;
    color: #6B4FA0;
    margin-top: 2px;
  }
  .letter-card:nth-child(6n+1) { background: #FFE5E5; }
  .letter-card:nth-child(6n+2) { background: #E5F3FF; }
  .letter-card:nth-child(6n+3) { background: #FFF6D9; }
  .letter-card:nth-child(6n+4) { background: #E6FFE9; }
  .letter-card:nth-child(6n+5) { background: #F3E5FF; }
  .letter-card:nth-child(6n+6) { background: #FFE9F3; }

  .burst {
    position: fixed;
    pointer-events: none;
    font-size: 50px;
    animation: floatUp 1s ease-out forwards;
    z-index: 20;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.5); opacity: 1; }
    100% { transform: translateY(-100px) scale(1.4); opacity: 0; }
  }
</style>
</head>
<body>

<!-- MAIN MENU -->
<div class="screen active" id="menu">
  <div id="menuGrid">
    <button class="menu-btn" id="menuAnimals">🐶<span class="label">חיות</span></button>
    <button class="menu-btn" id="menuTools">🔧<span class="label">כלי עבודה</span></button>

<script>
/* ---------------- Navigation ---------------- */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
document.getElementById('menuAnimals').addEventListener('click', () => showScreen('animalsScreen'));
document.getElementById('menuTools').addEventListener('click', () => showScreen('toolsScreen'));
document.getElementById('menuNotes').addEventListener('click', () => showScreen('notesScreen'));
document.getElementById('menuColors').addEventListener('click', () => showScreen('colorsScreen'));
document.getElementById('menuNumbers').addEventListener('click', () => showScreen('numbersScreen'));
document.getElementById('menuFarts').addEventListener('click', () => showScreen('fartsScreen'));
document.getElementById('menuBubbles').addEventListener('click', () => showScreen('bubblesScreen'));
document.getElementById('menuShapes').addEventListener('click', () => showScreen('shapesScreen'));
document.getElementById('menuBalloons').addEventListener('click', () => showScreen('balloonsScreen'));
document.getElementById('menuBells').addEventListener('click', () => showScreen('bellsScreen'));
document.getElementById('menuLetters').addEventListener('click', () => showScreen('lettersScreen'));
document.getElementById('menuLettersEn').addEventListener('click', () => showScreen('lettersEnScreen'));
document.getElementById('menuLettersAr').addEventListener('click', () => showScreen('lettersArScreen'));
document.querySelectorAll('[data-back]').forEach(btn => {
  btn.addEventListener('click', () => showScreen('menu'));
});

/* ---------------- Shared burst effect ---------------- */
const hearts = ['💛','✨','⭐','💚','💗'];
function burstAt(btn, emoji) {
  const rect = btn.getBoundingClientRect();
  const burst = document.createElement('div');
  burst.className = 'burst';
  burst.textContent = emoji || hearts[Math.floor(Math.random() * hearts.length)];
  burst.style.left = (rect.left + rect.width / 2 - 25) + 'px';
  burst.style.top = (rect.top + rect.height / 2 - 25) + 'px';
  document.body.appendChild(burst);
  setTimeout(() => burst.remove(), 1000);
}
function wiggle(btn) {
  btn.classList.remove('playing');
  void btn.offsetWidth;
  btn.classList.add('playing');
}
function speakText(text, lang) {
  if (!('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang || 'he-IL';
  utter.rate = 0.85;
  utter.pitch = 1.2;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

/* ---------------- ANIMALS: real recordings + spoken name & sound ---------------- */
const animalSounds = {
  dog: new Audio('https://commons.wikimedia.org/wiki/Special:Redirect/file/Barking_of_a_dog.ogg'),

/* ---------------- Web Audio setup (tools + notes) ---------------- */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

/* ---------------- TOOLS: pleasant sine-tone sounds, same gentle feel as the notes ---------------- */
function playGentleTone(freq, duration, when) {
  const ctx = getAudioCtx();
  const now = when;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.3, now + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now + duration);
}

function playToolSound(type) {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;

  if (type === 'hammer') {
    // two cheerful knocks
    playGentleTone(392.00, 0.25, now);        // G
    playGentleTone(523.25, 0.3, now + 0.15);  // C
  } else if (type === 'wrench') {
    // little rising chime
    playGentleTone(440.00, 0.3, now);         // A
    playGentleTone(659.25, 0.35, now + 0.1);  // E
  } else if (type === 'screwdriver') {
    // gentle spinning trill
    playGentleTone(523.25, 0.2, now);
    playGentleTone(587.33, 0.2, now + 0.1);
    playGentleTone(659.25, 0.3, now + 0.2);
  } else if (type === 'saw') {
    // playful back-and-forth
    playGentleTone(349.23, 0.2, now);
    playGentleTone(440.00, 0.2, now + 0.12);
    playGentleTone(349.23, 0.25, now + 0.24);
  } else if (type === 'paint') {
    // soft gliding tone
    playGentleTone(587.33, 0.5, now);
  } else if (type === 'scissors') {
    // two quick "snip" sounds
    playGentleTone(880.00, 0.1, now);
    playGentleTone(987.77, 0.12, now + 0.15);
  }
}

/* ---------------- FARTS: simple, reliable sawtooth "brrrt" synth ---------------- */
function playFartSound(variant) {
  const ctx = getAudioCtx();
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;

  const configs = [
    { baseFreq: 90,  duration: 0.5, wobbleRate: 28, wobbleDepth: 30 }, // classic
    { baseFreq: 65,  duration: 0.8, wobbleRate: 18, wobbleDepth: 22 }, // long rumbly
    { baseFreq: 140, duration: 0.3, wobbleRate: 40, wobbleDepth: 45 }, // short squeaky
    { baseFreq: 50,  duration: 0.6, wobbleRate: 12, wobbleDepth: 15 }, // deep bass
    { baseFreq: 200, duration: 0.25, wobbleRate: 50, wobbleDepth: 60 }, // tiny high squeak
    { baseFreq: 100, duration: 0.7, wobbleRate: 22, wobbleDepth: 35 }  // wet wobbly
  ];
  const cfg = configs[variant % configs.length];

  // Main tone: sawtooth gives it a buzzy edge
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(cfg.baseFreq, now);
  // slight downward glide like a real fart tailing off
  osc.frequency.exponentialRampToValueAtTime(cfg.baseFreq * 0.6, now + cfg.duration);

  // Vibrato LFO modulates the pitch to create the "brrrt" buzzing texture
  const lfo = ctx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = cfg.wobbleRate;
  const lfoGain = ctx.createGain();
  lfoGain.gain.value = cfg.wobbleDepth;
  lfo.connect(lfoGain);
  lfoGain.connect(osc.frequency);

  // Lowpass filter to soften the harsh sawtooth edge
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 900;
  filter.Q.value = 1;

  // Loud, clear envelope
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.9, now + 0.04);
  gain.gain.setValueAtTime(0.9, now + cfg.duration * 0.7);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + cfg.duration);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);

  osc.start(now);
  lfo.start(now);
  osc.stop(now + cfg.duration);
  lfo.stop(now + cfg.duration);
}

/* ---------------- BUBBLES: satisfying "pop" sound ---------------- */
function playPopSound(variant) {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const pitch = 500 + variant * 90;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(pitch * 0.5, now);
  osc.frequency.exponentialRampToValueAtTime(pitch * 1.8, now + 0.06);
  osc.frequency.exponentialRampToValueAtTime(pitch * 0.9, now + 0.12);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.35, now + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);

  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.2);
}

/* ---------------- BALLOONS: squeaky rubbing sound ---------------- */
function playBalloonSound(variant) {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const baseFreq = 300 + variant * 60;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'triangle';

  osc.frequency.setValueAtTime(baseFreq, now);
  osc.frequency.linearRampToValueAtTime(baseFreq * 1.4, now + 0.1);
  osc.frequency.linearRampToValueAtTime(baseFreq * 0.9, now + 0.2);
  osc.frequency.linearRampToValueAtTime(baseFreq * 1.2, now + 0.3);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.25, now + 0.03);
  gain.gain.setValueAtTime(0.25, now + 0.28);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.35);
}

/* ---------------- BELLS: bright bell chime with harmonics ---------------- */
function playBellSound(variant) {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const bellScale = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00]; // C D E F G A
  const freq = bellScale[variant % bellScale.length];

  // Bell timbre: fundamental + a couple of slightly detuned overtones
  [1, 2.01, 3.03].forEach((mult, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq * mult;
    const peak = 0.3 / (i + 1);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(peak, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.1 - i * 0.2);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 1.2);
  });
}
